<script>

/* ===== Motore locale: i dati restano su questo dispositivo (IndexedDB) ===== */
const TABLES=['apartments','rooms','tenants','contracts','rent_dues','payments','expense_types','expenses','allocations','allocation_shares','share_payments','deposit_moves','documents'];
const COLS={apartments:'name,address,city,rooms,beds,description,notes',rooms:'apartment_id,name,beds',tenants:'first_name,last_name,tax_code,phone,email,notes',
 contracts:'tenant_id,apartment_id,room_id,start_date,end_date,monthly_rent,deposit,due_day,notes',payments:'due_id,paid_on,amount,method,notes',
 expenses:'apartment_id,type_id,description,amount,spent_on,period_from,period_to,supplier,notes',expense_types:'name',share_payments:'share_id,paid_on,amount,method,notes',deposit_moves:'contract_id,kind,moved_on,amount,method,notes'};
const REQ={apartments:['name','address','city'],rooms:['apartment_id','name'],tenants:['first_name','last_name'],contracts:['tenant_id','apartment_id','start_date','monthly_rent'],
 payments:['due_id','paid_on','amount'],expenses:['apartment_id','amount','spent_on','period_from','period_to'],expense_types:['name'],share_payments:['share_id','paid_on','amount'],deposit_moves:['contract_id','kind','moved_on','amount']};
const NUM=['rooms','beds','monthly_rent','deposit','due_day','amount'],FK={tenants:[['contracts','tenant_id']],apartments:[['contracts','apartment_id'],['expenses','apartment_id']],expense_types:[['expenses','type_id']],rooms:[['contracts','room_id']]},
 CAS={contracts:[['rent_dues','contract_id']],rent_dues:[['payments','due_id']],expenses:[['allocations','expense_id'],['documents','expense_id']],allocations:[['allocation_shares','allocation_id']],apartments:[['rooms','apartment_id']]};
let DB;const P=r=>new Promise((ok,ko)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}),
 all=t=>P(DB.transaction(t).objectStore(t).getAll()),get=(t,id)=>P(DB.transaction(t).objectStore(t).get(id)),
 put=async(t,o,q)=>{const id=await P(DB.transaction(t,'readwrite').objectStore(t).put(o));if(!q)await touch();return{...o,id}},
 sum0=a=>a.reduce((s,x)=>s+x,0),sumk=(a,k)=>a.reduce((s,x)=>s+x[k],0),today=()=>new Date().toISOString().slice(0,10);
const gm=async k=>(await P(DB.transaction('meta').objectStore('meta').get(k)))?.v,sm=(k,v)=>P(DB.transaction('meta','readwrite').objectStore('meta').put({k,v})),touch=()=>sm('lastModified',new Date().toISOString()),
 pad=n=>String(n).padStart(2,'0'),stamp=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+'-'+pad(d.getMinutes()),

function bdg(t,ok,nu){return`<span class="bdg ${nu?'nu':ok?'ok':'no'}">${esc(t)}</span>`}
async function fingerprint(){const ser=v=>v&&typeof v=='object'?(v instanceof Blob?'B'+v.size+v.type:Array.isArray(v)?'['+v.map(ser).join(',')+']':'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+ser(v[k])).join(',')+'}'):JSON.stringify(v===undefined?null:v);
 let h1=0xdeadbeef,h2=0x41c6ce57;const add=x=>{for(let i=0;i<x.length;i++){const c=x.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}};
 for(const t of TABLES){const rows=(await all(t)).sort((a,b)=>a.id-b.id);add(t+'#'+rows.length+'#');for(const r of rows)add(ser(r)+'\n')}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(16)+(h1>>>0).toString(16)}
async function needBackup(lm,ref){const bh=await gm('backupHash');if(bh)return bh!==await fingerprint();if(ref)return!!lm&&lm>ref;for(const t of TABLES)if(t!='expense_types'&&(await all(t)).length)return true;return false}
async function lastExp(){const v=await gm('lastExport');if(v)return v;try{return+localStorage.lastBackup?new Date(+localStorage.lastBackup).toISOString():null}catch{return null}}
async function rm(t,id){if(t=='deposit_moves'){const m=await get(t,id);if(m&&m.kind=='versamento'){const dr=(await depositRows()).find(d=>d.id===m.contract_id);if(dr&&dr.held-m.amount<-.005)throw'Impossibile eliminare: la caparra è già stata restituita (elimina prima la restituzione)'}}
 if(t=='contracts'&&(await all('deposit_moves')).some(m=>m.contract_id===id))throw'Il contratto ha movimenti di caparra registrati: eliminali prima (menu Caparre)';if(t=='allocations'){const ss=(await all('allocation_shares')).filter(s=>s.allocation_id===id).map(s=>s.id);if((await all('share_payments')).some(p=>ss.includes(p.share_id)))throw'Ci sono incassi registrati su questa ripartizione: eliminali prima (menu Incassi spese)'}if(t=='contracts'){const ds=(await all('rent_dues')).filter(d=>d.contract_id===id).map(d=>d.id);if((await all('payments')).some(p=>ds.includes(p.due_id)))throw'Il contratto ha pagamenti registrati: per conservare lo storico imposta la data di uscita invece di eliminarlo'}for(const[c,k]of FK[t]||[])if((await all(c)).some(x=>x[k]===id))throw'Impossibile eliminare: ci sono dati collegati (storico da conservare)';

function norm(t,b){const o={};for(const k of COLS[t].split(',')){let v=b[k];if(v===''||v===undefined)v=null;else if(k.endsWith('_id')||NUM.includes(k))v=Number(String(v).replace(',','.'));o[k]=v}if(b.id)o.id=Number(b.id);return o}
async function check(t,o){if(t=='deposit_moves'){if(!['versamento','restituzione'].includes(o.kind))throw'Tipo di movimento non valido';const dr=(await depositRows()).find(d=>d.id===o.contract_id);
  if(dr&&o.kind=='versamento'&&dr.deposit>0&&o.amount>dr.toPay+.005)throw"L'importo supera la caparra ancora da versare ("+dr.toPay.toFixed(2)+" €)";
  if(dr&&o.kind=='restituzione'&&o.amount>dr.held+.005)throw"L'importo supera la caparra in deposito ("+dr.held.toFixed(2)+" €)"}
 if(t=='contracts'&&o.deposit!=null&&o.deposit<0)throw'La caparra non può essere negativa';
 if(t=='share_payments'){const sr=(await sharesRows()).find(s=>s.id===o.share_id);if(sr&&o.amount>sr.remaining+.005)throw"L'importo supera il residuo ("+sr.remaining.toFixed(2)+" €)"}
 if(t=='payments'){const du=(await duesRows()).find(d=>d.id===o.due_id);if(du&&o.amount>du.remaining+.005)throw"L'importo supera il residuo ("+du.remaining.toFixed(2)+" €)"}
 if(t=='contracts'&&o.due_day&&(o.due_day<1||o.due_day>28))throw'Il giorno di scadenza deve essere tra 1 e 28';
 if(t=='tenants'&&o.tax_code){o.tax_code=o.tax_code.toUpperCase().trim();if(!/^[A-Z0-9]{16}$/.test(o.tax_code))throw'Codice fiscale non valido (16 caratteri)'}for(const k of REQ[t]||[])if(o[k]==null||Number.isNaN(o[k]))throw'Compila il campo obbligatorio: '+k;
 if((t=='payments'||t=='expenses'||t=='share_payments'||t=='deposit_moves')&&o.amount<=0)throw'L\'importo deve essere maggiore di zero';
 if(t=='contracts'){if(o.end_date&&o.end_date<o.start_date)throw'La data di uscita precede quella di ingresso';
  if(o.room_id)for(const c of await all('contracts'))if(c.id!==o.id&&c.room_id===o.room_id&&o.start_date<=(c.end_date||'9999')&&c.start_date<=(o.end_date||'9999'))throw'La camera è già assegnata in quel periodo'}
 if(t=='expenses'&&o.period_to<o.period_from)throw'Periodo di competenza non valido'}
function split(total,w){const S=sum0(w);if(!S)throw'I valori inseriti non possono essere tutti zero';const raw=w.map(x=>total*x/S),fl=raw.map(Math.floor),rem=total-sum0(fl);
 raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,rem).forEach(([,i])=>fl[i]++);return fl}
async function involved(e){const m=new Map();
 for(const c of(await all('contracts')).filter(c=>c.apartment_id===e.apartment_id&&c.start_date<=e.period_to&&(!c.end_date||c.end_date>=e.period_from))){
  const f=c.start_date>e.period_from?c.start_date:e.period_from,t=c.end_date&&c.end_date<e.period_to?c.end_date:e.period_to;

async function duesRows(month){const[D,C,Te,Ap,Pa]=await Promise.all(['rent_dues','contracts','tenants','apartments','payments'].map(all));
 return D.filter(d=>!month||d.month.slice(0,7)===month).map(d=>{const c=C.find(x=>x.id===d.contract_id),t=Te.find(x=>x.id===c.tenant_id),paid=sumk(Pa.filter(p=>p.due_id===d.id),'amount'),rem=Math.round((d.amount-paid)*100)/100;
  return{id:d.id,month:d.month,amount:d.amount,tenant:t.first_name+' '+t.last_name,apartment:Ap.find(x=>x.id===c.apartment_id).name,apt:c.apartment_id,paid,remaining:rem,late:rem>0&&d.month.slice(0,8)+String(c.due_day||5).padStart(2,'0')<today()}})
 .sort((a,b)=>b.month.localeCompare(a.month)||a.apartment.localeCompare(b.apartment))}
async function sharesRows(){const[Al,Sh,SP,E,Te,Ap,Ty]=await Promise.all(['allocations','allocation_shares','share_payments','expenses','tenants','apartments','expense_types'].map(all));
 return Sh.map(s=>{const al=Al.find(a=>a.id===s.allocation_id),e=al&&E.find(x=>x.id===al.expense_id);if(!e)return null;const t=Te.find(x=>x.id===s.tenant_id),pays=SP.filter(p=>p.share_id===s.id).sort((x,y)=>y.paid_on.localeCompare(x.paid_on)||y.id-x.id),pc=sum0(pays.map(p=>Math.round(p.amount*100)));
  return{id:s.id,expense_id:e.id,desc:e.description||Ty.find(x=>x.id===e.type_id)?.name||'Spesa',spent_on:e.spent_on,apt:e.apartment_id,apartment:Ap.find(x=>x.id===e.apartment_id)?.name||'',tenant_id:s.tenant_id,tenant:t.first_name+' '+t.last_name,
   final:s.final_cents/100,paid:pc/100,remaining:(s.final_cents-pc)/100,payments:pays}}).filter(Boolean).sort((a,b)=>b.spent_on.localeCompare(a.spent_on)||a.tenant.localeCompare(b.tenant))}
async function depositRows(){const[C,Te,Ap,M]=await Promise.all(['contracts','tenants','apartments','deposit_moves'].map(all)),rk={'Da restituire':0,'Da versare':1,'Versata in parte':1,'Versata':2,'Restituita in parte':2,'Restituita':3};
 return C.map(c=>{const mv=M.filter(m=>m.contract_id===c.id).sort((a,b)=>b.moved_on.localeCompare(a.moved_on)||b.id-a.id);if(!(c.deposit>0)&&!mv.length)return null;
  const cs=k=>sum0(mv.filter(m=>m.kind===k).map(m=>Math.round(m.amount*100)))/100,paid=cs('versamento'),ret=cs('restituzione'),held=Math.round((paid-ret)*100)/100,dep=c.deposit||0,toPay=Math.max(0,Math.round((dep-paid)*100)/100),ended=!!c.end_date&&c.end_date<today(),t=Te.find(x=>x.id===c.tenant_id);
  const status=ret>0&&held<=.004?'Restituita':held>.004&&ended?'Da restituire':ret>0?'Restituita in parte':paid<=0?'Da versare':toPay>.004?'Versata in parte':'Versata';
  return{id:c.id,tenant:t.first_name+' '+t.last_name,apartment:Ap.find(x=>x.id===c.apartment_id)?.name||'',apt:c.apartment_id,start:c.start_date,end:c.end_date,deposit:dep,paid,returned:ret,held,toPay,status,moves:mv}})
  .filter(Boolean).sort((a,b)=>rk[a.status]-rk[b.status]||a.tenant.localeCompare(b.tenant))}
async function route(p,o){const m=o.method||'GET',b=o.body,[path,qs]=p.split('?'),a=path.split('/'),Q=new URLSearchParams(qs||'');
 if(COLS[a[0]]&&a.length<3){const t=a[0];if(m=='GET')return(await all(t)).sort((x,y)=>y.id-x.id);
  if(m=='DELETE'){await rm(t,+a[1]);return{ok:1}}const x=norm(t,b);if(a[1])x.id=+a[1];await check(t,x);
  if(t=='expenses'&&x.id){const old=await get('expenses',x.id),al=(await all('allocations')).find(q=>q.expense_id===x.id);
